[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "test-repair-engine"
version = "0.1.0.dev0"
description = "Runtime recovery for broken Playwright tests."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Marcin Mikula" }
]
keywords = [
    "testing",
    "pytest",
    "playwright",
    "test-automation",
    "self-healing",
    "test-repair",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "pydantic>=2.10,<3",
    "playwright>=1.44,<2",
    "pytest>=8,<10",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=5,<8",
    "ruff>=0.8,<1",
]

[project.entry-points.pytest11]
test-repair-engine = "test_repair_engine.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
test_repair_engine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "unit: small deterministic tests without browser or external services",
    "integration: tests across component boundaries",
    "e2e: real runtime repair scenarios",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
